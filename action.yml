name: "Kotoshu spell check"
description: "Run the Kotoshu spell checker on your repository via the gem directory mode (gitignore-aware walk). Caches dictionaries between runs, supports baselines, and uploads SARIF results to the GitHub Security tab."
branding:
  icon: "check-circle"
  color: "blue"

inputs:
  files:
    description: "Files, directories, or glob patterns to check (space-separated). Directories are walked by the gem itself (gitignore-aware, skips .git/node_modules/vendor/target). Default: the whole repository."
    required: false
    default: "."
  language:
    description: "Language code (any set-up language, e.g. en, de, it, el) or 'auto'."
    required: false
    default: "auto"
  format:
    description: "Output format: text, json, or sarif."
    required: false
    default: "sarif"
  baseline:
    description: "Baseline JSON file (see kotoshu baseline init). Errors it covers pass; only new errors fail the check. Paths must be relative to the repository root, matching how the action runs the check."
    required: false
    default: ""
  include:
    description: "Directory mode only: check just files matching these globs (space-separated; replaces the known-extension default)."
    required: false
    default: ""
  exclude:
    description: "Directory mode only: skip files matching these globs (space-separated; always wins over include)."
    required: false
    default: ""
  show_suppressed:
    description: "Also list entries suppressed by inline directives or the baseline (SARIF notes; does not affect pass/fail)."
    required: false
    default: "false"
  fail_on_error:
    description: "Fail the workflow step if failing spelling errors are found (with a baseline: only errors the baseline does not cover)."
    required: false
    default: "true"
  category:
    description: "SARIF upload category, also used to scope the report artifact name (used when format is sarif or json)."
    required: false
    default: "kotoshu"
  version:
    description: "kotoshu gem version to install (empty = latest). Must be >= 0.8.0 (directory mode and baselines)."
    required: false
    default: ""
  prewarm_languages:
    description: "Languages to set up before running (space-separated)."
    required: false
    default: "en"
  offline:
    description: "Skip network — use only cached dictionaries. Set to 'false' to allow downloads."
    required: false
    default: "true"
  output_path:
    description: "Where to write the report for upload (all formats)."
    required: false
    default: "kotoshu-results.sarif"

outputs:
  sarif-path:
    description: "Path to the SARIF/JSON report (empty when format is text)."
    value: ${{ steps.run.outputs.sarif-path }}
  error-count:
    description: "Number of failing spelling errors (new errors only, when a baseline is set)."
    value: ${{ steps.run.outputs.error-count }}

runs:
  using: "composite"
  steps:
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: "3.4"

    - name: Cache kotoshu dictionaries
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/kotoshu
          ~/.local/share/kotoshu
        key: kotoshu-${{ inputs.prewarm_languages }}-${{ runner.os }}-v1

    - name: Install kotoshu
      shell: bash
      env:
        KOTOSHU_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        if [ -n "$KOTOSHU_VERSION" ]; then
          gem install kotoshu --version "$KOTOSHU_VERSION" --no-document
        else
          gem install kotoshu --no-document
        fi
        kotoshu --version

        # v2 of this action relies on the gem directory mode and
        # baselines, both introduced in kotoshu 0.8.0.
        installed="$(kotoshu --version | awk '{print $NF}')"
        oldest="$(printf '%s\n0.8.0\n' "$installed" | sort -V | head -1)"
        if [ "$oldest" != "0.8.0" ]; then
          echo "::error::action v2 requires kotoshu >= 0.8.0, found $installed. Pin a newer version with the version input."
          exit 1
        fi

    - name: Pre-warm languages
      shell: bash
      env:
        KOTOSHU_OFFLINE: ${{ inputs.offline }}
        PREWARM: ${{ inputs.prewarm_languages }}
      run: |
        set -euo pipefail
        for lang in $PREWARM; do
          if KOTOSHU_OFFLINE=0 kotoshu setup "$lang" 2>&1; then
            echo "pre-warmed $lang"
          else
            echo "::warning::Failed to pre-warm $lang — will skip if offline"
          fi
        done

    - name: Run kotoshu check
      id: run
      shell: bash
      env:
        KOTOSHU_OFFLINE: ${{ inputs.offline }}
        FILES: ${{ inputs.files }}
        LANGUAGE: ${{ inputs.language }}
        FORMAT: ${{ inputs.format }}
        BASELINE: ${{ inputs.baseline }}
        INCLUDE: ${{ inputs.include }}
        EXCLUDE: ${{ inputs.exclude }}
        SHOW_SUPPRESSED: ${{ inputs.show_suppressed }}
        OUTPUT_PATH: ${{ inputs.output_path }}
        FAIL_ON_ERROR: ${{ inputs.fail_on_error }}
      run: |
        set -euo pipefail

        # Build the target list. Globs (tokens containing *, ?, or [)
        # are expanded here; directories and plain paths are passed
        # through so the gem directory mode walks them (gitignore-aware).
        shopt -s nullglob globstar
        targets=()
        saw_token=0
        for token in $FILES; do
          saw_token=1
          case "$token" in
            *[\*\?\[]*)
              for f in $token; do
                targets+=("$f")
              done
              ;;
            *)
              targets+=("$token")
              ;;
          esac
        done
        shopt -u nullglob globstar

        if [ "$saw_token" -eq 0 ] || [ ${#targets[@]} -eq 0 ]; then
          echo "::warning::No targets to check (files: '$FILES')"
          echo "error-count=0" >> "$GITHUB_OUTPUT"
          echo "sarif-path=" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # Map inputs onto kotoshu check flags (kotoshu help check).
        args=()
        for glob in $INCLUDE; do args+=(--include "$glob"); done
        for glob in $EXCLUDE; do args+=(--exclude "$glob"); done
        if [ -n "$BASELINE" ]; then
          args+=(--baseline "$BASELINE")
        fi
        if [ "$SHOW_SUPPRESSED" = "true" ]; then
          args+=(--show-suppressed)
        fi

        # Exit codes: 0 no errors, 1 errors found, 2 usage error,
        # 3 language not set up. Anything above 1 is a hard failure.
        rc=0
        if [ "$FORMAT" = "text" ]; then
          kotoshu check ${targets[@]+"${targets[@]}"} \
            --language "$LANGUAGE" --format text ${args[@]+"${args[@]}"} \
            | tee "$OUTPUT_PATH" || rc=${PIPESTATUS[0]}
        else
          kotoshu check ${targets[@]+"${targets[@]}"} \
            --language "$LANGUAGE" --format "$FORMAT" ${args[@]+"${args[@]}"} \
            > "$OUTPUT_PATH" || rc=$?
        fi

        # Directory mode emits one SARIF run per file; code scanning no
        # longer combines multiple runs in one file per category, so
        # merge them into a single run (shared tool descriptor; each
        # result keeps its own artifactLocation URI). Skipped silently
        # when no parseable report exists (e.g. a usage error run) so
        # the gem exit code still decides the step outcome.
        if [ "$FORMAT" = "sarif" ]; then
          ruby -rjson -e '
            begin
              doc = JSON.parse(File.read(ARGV[0]))
            rescue JSON::ParserError, Errno::ENOENT
              exit
            end
            runs = doc["runs"]
            if runs.is_a?(Array) && runs.size > 1 && runs.first.is_a?(Hash)
              doc["runs"] = [{
                "tool" => runs.first["tool"],
                "results" => runs.flat_map { |r| (r || {})["results"] || [] }
              }]
              File.write(ARGV[0], JSON.pretty_generate(doc))
            end
          ' "$OUTPUT_PATH" || true
        fi

        # Failing error count from the report (new errors only when a
        # baseline is set; suppressed entries are notes, not warnings).
        error_count="$(ruby -e '
          doc = File.read(ARGV[0])
          count =
            if ARGV[1] == "json"
              require "json"
              JSON.parse(doc)["errorCount"]
            elsif ARGV[1] == "sarif"
              require "json"
              JSON.parse(doc)["runs"].sum do |run|
                (run["results"] || []).count { |r| r["level"] == "warning" }
              end
            else
              doc[/(\d+) errors?\s*\z/, 1].to_i
            end
          puts count
        ' "$OUTPUT_PATH" "$FORMAT" 2>/dev/null || echo 0)"

        echo "error-count=$error_count" >> "$GITHUB_OUTPUT"
        if [ "$FORMAT" = "text" ]; then
          echo "sarif-path=" >> "$GITHUB_OUTPUT"
        else
          echo "sarif-path=$OUTPUT_PATH" >> "$GITHUB_OUTPUT"
        fi

        if [ "$rc" -eq 0 ]; then
          exit 0
        fi
        if [ "$rc" -eq 1 ]; then
          if [ "$FAIL_ON_ERROR" != "true" ]; then
            echo "::warning::Kotoshu found $error_count failing spelling error(s)"
            exit 0
          fi
          echo "::error::Kotoshu found $error_count failing spelling error(s)"
          exit 1
        fi
        echo "::error::kotoshu check exited with $rc (see log above; 2 = usage error, 3 = language not set up)"
        exit "$rc"

    - name: Upload SARIF to Security tab
      if: inputs.format == 'sarif' && always()
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ inputs.output_path }}
        category: ${{ inputs.category }}

    - name: Upload report artifact
      if: always() && (inputs.format == 'sarif' || inputs.format == 'json')
      uses: actions/upload-artifact@v4
      with:
        name: kotoshu-report-${{ inputs.category }}
        path: ${{ inputs.output_path }}
